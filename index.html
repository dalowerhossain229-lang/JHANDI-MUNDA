<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHANDI MUNDA - PREMIUM ASIAN DICE KING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার ব্লকার (style.css দিয়ে হাইড লক করা ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="class-name">JHANDI MUNDA</div>
            <div class="class-game">PREMIUM ASIAN DICE KING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎲 ৬টি লাইভ ডাইস রোলিং জোন এরিয়া ভাই ভাই -->
    <div class="dice-rolling-arena">
        <div class="dice-cup-frame">
            <div class="dice-box-node" id="dice-0"><div class="dice-blank-default"></div></div>
            <div class="dice-box-node" id="dice-1"><div class="dice-blank-default"></div></div>
            <div class="dice-box-node" id="dice-2"><div class="dice-blank-default"></div></div>
            <div class="dice-box-node" id="dice-3"><div class="dice-blank-default"></div></div>
            <div class="dice-box-node" id="dice-4"><div class="dice-blank-default"></div></div>
            <div class="dice-box-node" id="dice-5"><div class="dice-blank-default"></div></div>
        </div>
    </div>

    <!-- 💸 বাজি ধরার প্রধান ৬টি ঐতিহ্যবাহী নিয়ন বেটিং স্পট গ্রিড ভাই ভাই -->
    <div class="betting-board-grid">
        <button class="bet-board-btn symbol-btn" id="board-FLAG" onclick="selectBetSide('FLAG')">
            <img src="symbol_FLAG.png" class="spot-icon" alt="Flag">
            <span class="board-label">FLAG (ঝান্ডি)</span>
        </button>

        <button class="bet-board-btn symbol-btn" id="board-CROWN" onclick="selectBetSide('CROWN')">
            <img src="symbol_CROWN.png" class="spot-icon" alt="Crown">
            <span class="board-label">CROWN (মুন্ডা)</span>
        </button>

        <button class="bet-board-btn symbol-btn" id="board-SPADE" onclick="selectBetSide('SPADE')">
            <img src="symbol_SPADE.png" class="spot-icon" alt="Spade">
            <span class="board-label">SPADE (ইশকাব)</span>
        </button>

        <button class="bet-board-btn symbol-btn" id="board-HEART" onclick="selectBetSide('HEART')">
            <img src="symbol_HEART.png" class="spot-icon" alt="Heart">
            <span class="board-label">HEART (হরতন)</span>
        </button>

        <button class="bet-board-btn symbol-btn" id="board-DIAMOND" onclick="selectBetSide('DIAMOND')">
            <img src="symbol_DIAMOND.png" class="spot-icon" alt="Diamond">
            <span class="board-label">DIAMOND (রুইতন)</span>
        </button>

        <button class="bet-board-btn symbol-btn" id="board-CLUB" onclick="selectBetSide('CLUB')">
            <img src="symbol_CLUB.png" class="spot-icon" alt="Club">
            <span class="board-label">CLUB (चिড়িত)</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">যেকোনো চিহ্নে বাজি ধরে DEAL বোতাম চাপুন ওস্তাদ!</span>
    </div>

    <!-- 🎛️ বাজি ধরার প্রধান অ্যাকশন কন্ট্রোল বোর্ড প্যানেল ফুটার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleJhandiMundaDeal()">DEAL</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()"></button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইঙ্গো কালার ট্রেড সিঙ্ক - canইন্টারন্যাশনাল সকেট ইঞ্জিন লাইব্রেরি গেটওয়ে] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";

        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let selectedSide = null;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedSide = side;
            document.querySelectorAll('.bet-board-btn').forEach(btn => btn.classList.remove("active-side-bet"));
            if (document.getElementById(`board-${side}`)) {
                document.getElementById(`board-${side}`).classList.add("active-side-bet");
            }
            playAudio('click');
        }

        // 🎰 [🎰 ৮ ইমেজের সুপ্রিম ওরিজিনাল রুট ডাইস সিঙ্ক জাভাস্ক্রিপ্ট ইঞ্জিন ভাই ভাই]
        function animateDiceRolling(serverData) {
            const finalDices = serverData.diceResult || []; // ৬টি ছক্কার রেজাল্ট অ্যারে

            // ১. ওরিজিনাল ৩ডি ঘূর্ণায়মান মোশন ব্লার ইমেজ লোড করা হলো ভাই ভাই
            for (let i = 0; i < 6; i++) {
                const dBox = document.getElementById(`dice-${i}`);
                if (dBox) dBox.innerHTML = `<div class="dice-shake-loop-node"></div>`;
            }
            playAudio('spin');

            // 🕒 লাইভ ক্যাসিনো স্টাইল ১২০০ মিলি-সেকেন্ড কড়া রোলিং শেষে ছক্কার মুখ উন্মোচন ভাই ভাই
            setTimeout(() => {
                finalDices.forEach((symbolName, idx) => {
                    const dBox = document.getElementById(`dice-${idx}`);
                    if (dBox) {
                        // সরাসরি গিটহাবের রুট থেকে চিহ্নের ছবি পুশ করা হলো ওস্তাদ
                        dBox.innerHTML = `
                            <div class="card-deal-animation-node" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                                <img src="symbol_${symbolName}.png" style="width: 75%; height: 75%; object-fit: contain;" alt="Dice">
                            </div>`;
                    }
                });
                playAudio('spin');
                
                // ফাইনাল রাউন্ড উইন-লস সেটেলমেন্ট নোটিশ ফায়ার
                showFinalGameReward(serverData.status, serverData.winAmount, serverData.matchCount, serverData.resultSymbol);
            }, 1200);
        }

        async function handleJhandiMundaDeal() {
            if (isSpinning) return;
            if (!selectedSide) {
                alert("🔒 বাзи প্লে করার আগে দয়া করে যেকোনো ১টি ডাইস প্রতীক সিলেক্ট করুন ওস্তাদ!");
                return;
            }

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 কাপের ভেতর ছক্কা ঘূর্ণন হচ্ছে, অপেক্ষা করুন ভাই...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/jhandi-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedSide,
                        game: "jhandimunda" // লবির শর্টকোডের সাথে ১০০% একুরেট সিঙ্ক ভাই
                    })
                });

                const serverRes = await response.json();
                
                // 🎯 [মেগা কিল ট্র্যাপ ইন্টারসেপ্টর বর্ম]: কোনো ফেক পপআপ এরর মারা ছাড়া ওয়ান-শটে লাইভ এনিমেশন সচল করবে ভাই
                if (serverRes.success || serverRes.success === true) {
                    balance = parseFloat(serverRes.balance || serverRes.data?.balance || balance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                    
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");
                    
                    animateDiceRolling(serverRes.gameData);
                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    stopJhandiState();
                }
            } catch (err) {
                console.log("Jhandi-Munda Data Gateway Syncing Stream.");
                stopJhandiState();
            }
        }

        function showFinalGameReward(status, winAmount, matchCount, resultSymbol) {
        const msgBox = document.getElementById("win-status-box");
        const textMsg = document.getElementById("win-text-msg");
        
        if (status === "win") {
            playAudio('win');
            if (msgBox) msgBox.className = "win-status-container win-glow-bar";
            if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! আপনার প্রতীকটি <b>${matchCount} বার</b> মিলেছে - ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
        } else {
            playAudio('wheel');
            if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
            if (textMsg) textMsg.innerHTML = `💥 ওহ হো মিস! এই রাউন্ডে আপনার সিলেক্ট করা প্রতীক একটি ছক্কাতেও মেলেনি ওস্তাদ!`;
        }

        fetchLiveBalance();
        stopJhandiState();

        if (isAuto) {
            autoInterval = setTimeout(() => {
                if (isAuto) handleJhandiMundaDeal();
            }, 3000);
        }
    }

    if (typeof io !== 'undefined') {
        const socket = io();
        socket.on("balanceUpdate", (data) => {
            if (data && data.username === urlUserId) {
                if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                fetchLiveBalance();
            }
        });
    }

    async function fetchLiveBalance() {
        try {
            const response = await fetch(`${SERVER_URL}/api/jhandi-balance?userId=${urlUserId}&wallet=${urlWallet}`);
            const serverData = await response.json();
            if (serverData.success) {
                balance = parseFloat(serverData.balance);
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }
        } catch (e) { console.error("Jhandi balance sync lag pass"); }
    }

    window.onload = () => {
        if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
        fetchLiveBalance();
    };

    function toggleMute() {
        isMuted = !isMuted;
        const muteEl = document.getElementById("mute-btn");
        if (muteEl) muteEl.innerText = isMuted ? "🔇" : "🔊";
        slotSounds.click.muted = isMuted;
        slotSounds.spin.muted = isMuted;
        slotSounds.win.muted = isMuted;
        slotSounds.wheel.muted = isMuted;
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoEl = document.getElementById("auto-btn");
        if (autoEl) autoEl.classList.toggle('active', isAuto);
        if (isAuto && !isSpinning) handleJhandiMundaDeal();
        playAudio('click');
    }

    function stopJhandiState() {
        isSpinning = false;
        if (document.getElementById("spin-btn")) {
            document.getElementById("spin-btn").disabled = false;
        }
        if (!isAuto && autoInterval) clearTimeout(autoInterval);
    }

    const slotSounds = {
        click: new Audio('click2.mp3'),
        spin: new Audio('spin2.mp3'),
        win: new Audio('win2.mp3'),
        wheel: new Audio('wheel1.mp3')
    };
    Object.values(slotSounds).forEach(s => s.load());

    function playAudio(type) {
        if (isMuted) return;
        try {
            slotSounds[type].currentTime = 0;
            slotSounds[type].play();
        } catch(e) {}
    }
</script>
</body>
</html>
