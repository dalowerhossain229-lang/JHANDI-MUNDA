<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JHANDI MUNDA CASINO KING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">JHANDI MUNDA</div>
            <div class="game">6-DICE TRADITIONAL KING</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎲 [৬টি ছক্কার জাদুকরী নিয়াল ক্যানভাস জোন] -->
    <div class="dice-cup-zone">
        <canvas id="dice-canvas" width="360" height="200"></canvas>
    </div>

    <!-- 🎰 বাজি ধরার প্রধান ৬টি নিয়নের ক্যাসিনো ঘর প্যানেল ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn symbol-bet-btn" id="board-HEART" onclick="selectBetSide('HEART')">
            <span class="board-label">♥ হরতন</span>
        </button>
        <button class="bet-board-btn symbol-bet-btn" id="board-SPADE" onclick="selectBetSide('SPADE')">
            <span class="board-label">♠ ইস্কাবন</span>
        </button>
        <button class="bet-board-btn symbol-bet-btn" id="board-DIAMOND" onclick="selectBetSide('DIAMOND')">
            <span class="board-label">♦ রুইতন</span>
        </button>
        <button class="bet-board-btn symbol-bet-btn" id="board-CLUB" onclick="selectBetSide('CLUB')">
            <span class="board-label">♣ চিড়িত</span>
        </button>
        <button class="bet-board-btn symbol-bet-btn" id="board-CROWN" onclick="selectBetSide('CROWN')">
            <span class="board-label">👑 মুকুট</span>
        </button>
        <button class="bet-board-btn symbol-bet-btn" id="board-FLAG" onclick="selectBetSide('FLAG')">
            <span class="board-label">🚩 পতাকা</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">যেকোনো ১টি প্রতীকে বাজি ধরে SHAKE বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও SHAKE বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleDiceShake()">SHAKE</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("dice-canvas");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // HEART, SPADE, DIAMOND, CLUB, CROWN, FLAG
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // ৬টি প্রতীকের অফিশিয়াল টেক্সট প্রতীক লকিং ম্যাপ
        const symbolIcons = {
            "HEART": "♥", "SPADE": "♠", "DIAMOND": "♦", "CLUB": "♣", "CROWN": "👑", "FLAG": "🚩"
        };

        // ৬টি ছক্কার ক্যানভাস পজিশন তালিকা
        let diceList = [
            { x: 60, y: 60, symbol: "HEART", angle: 0 },
            { x: 140, y: 60, symbol: "SPADE", angle: 0 },
            { x: 220, y: 60, symbol: "DIAMOND", angle: 0 },
            { x: 60, y: 140, symbol: "CLUB", angle: 0 },
            { x: 140, y: 140, symbol: "CROWN", angle: 0 },
            { x: 220, y: 140, symbol: "FLAG", angle: 0 }
        ];

        function drawDiceFace(x, y, size, symbol, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // ছক্কার বেস গোল্ডেন ফ্রেম বর্ম
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-size/2, -size/2, size, size, 8);
            ctx.fill();
            ctx.stroke();

            // ভেতরের নিয়াল প্রতীক প্রিন্টার
            ctx.fillStyle = (symbol === "HEART" || symbol === "DIAMOND" || symbol === "FLAG") ? "#ea2027" : "#111827";
            if (symbol === "CROWN") ctx.fillStyle = "#e67e22";
            
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(symbolIcons[symbol], 0, 0);
            
            ctx.restore();
        }

        function renderDiceCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            diceList.forEach(d => {
                drawDiceFace(d.x, d.y, 44, d.symbol, d.angle);
            });
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/jhandi-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            renderDiceCanvas();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

                function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleDiceShake();
            playAudio('click');
        }

        async function handleDiceShake() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি প্রতীক (হরতন, ইস্কাবন ইত্যাদি) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const msgBox = document.getElementById("win-status-box");
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎲 ছক্কাগুলো পাত্রের ভেতর কাঁপছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // 🚀 ছক্কা নাড়ানোর সাথে সাথে spin2.mp3 কড়কড় মেটালিক সাউন্ড ফায়ার লক ভাই ভাই
            playAudio('spin');

            const symbolsArray = ["HEART", "SPADE", "DIAMOND", "CLUB", "CROWN", "FLAG"];

            // ৬টি ছক্কার ৩ডি ভাইব্রেশন মোশন লুপ এনিমেশন গেটওয়ে চালু ভাই ভাই
            let shakeFrameCount = 0;
            const shakeInterval = setInterval(() => {
                diceList.forEach(d => {
                    // কাঁচের বাটির ভেতর ছক্কাগুলোর ডাইনামিক র্যান্ডম কোঅর্ডিনেট মুভমেন্ট ভাই ভাই
                    d.x = 40 + Math.floor(Math.random() * 280);
                    d.y = 40 + Math.floor(Math.random() * 120);
                    d.angle = Math.random() * Math.PI * 2;
                    d.symbol = symbolsArray[Math.floor(Math.random() * symbolsArray.length)]; // ফ্ল্যাশ র্যান্ডমাইজেশন
                });
                renderDiceCanvas();
                shakeFrameCount++;
            }, 50);

            try {
                const response = await fetch(`${SERVER_URL}/api/jhandi-shake`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ২ সেকেন্ডের থ্রিল ভাইব্রেশন শেষ হওয়ার পর ওরিজিনাল সার্ভার ডাইস রেজাল্ট শো হবে ভাই ভাই
                    setTimeout(() => {
                        clearInterval(shakeInterval);
                        
                        // ব্যাকঅ্যান্ড থেকে আসা ৬টি ছক্কার ১ শতভাগ নিখুঁত রিয়ালিস্টিক পজিশন এলাইন ভাই
                        const serverDice = data.diceResult; // ৬টি প্রতীকের অ্যারে ভাই ভাই
                        
                        diceList = [
                            { x: 55, y: 55, symbol: serverDice[0], angle: 0.1 },
                            { x: 135, y: 45, symbol: serverDice[1], angle: -0.2 },
                            { x: 215, y: 55, symbol: serverDice[2], angle: 0.3 },
                            { x: 55, y: 135, symbol: serverDice[3], angle: -0.1 },
                            { x: 135, y: 145, symbol: serverDice[4], angle: 0.2 },
                            { x: 215, y: 135, symbol: serverDice[5], angle: -0.3 }
                        ];
                        renderDiceCanvas();

                        showFinalResult(data.status, data.winAmount, data.matchCount);
                    }, 2000);

                } else {
                    clearInterval(shakeInterval);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopDiceState();
                }
            } catch (err) {
                clearInterval(shakeInterval);
                alert("⚠️ সেশন আউট! আবার SHAKE বোতাম চাপুন ভাই ভাই।");
                stopDiceState();
            }
        }

        function showFinalResult(status, winAmount, matchCount) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            const iconMap = { "HEART": "♥", "SPADE": "♠", "DIAMOND": "♦", "CLUB": "♣", "CROWN": "👑", "FLAG": "🚩" };
            const symName = iconMap[selectedOption];

            if (status === "win") {
                // 🎵 বাজি জিতলে win2.mp3 রাজকীয় সাউন্ড ফায়ার লক ভাই!
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! আপনার প্রতীক [${symName}] মিলেছে ${matchCount} টি ছক্কায়! (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                if (matchCount > 0) {
                    textMsg.innerText = `❌ আপনার প্রতীক মিলেছে ${matchCount} টি ছক্কায়। তবে উইন লাইনে ভাগ্য সহায় হয়নি ভাই!`;
                } else {
                    textMsg.innerText = `❌ ওহ! কোনো ছক্কায় আপনার প্রতীক মেলেনি। আবার ট্রাই করুন ভাই ভাই!`;
                }
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopDiceState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleDiceShake();
                }, 2000);
            }
        }

        function stopDiceState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [আপনার রিকোয়ারমেন্ট অনুযায়ী ৩টি প্রিমিয়াম সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
